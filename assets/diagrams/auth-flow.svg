<svg width="1100" height="300" viewBox="0 0 1100 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="authBg" x1="0" y1="0" x2="1100" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#0E1016"/>
    </linearGradient>
    <radialGradient id="tokenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B6FE0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3B6FE0" stop-opacity="0"/>
    </radialGradient>
    <path id="a1" d="M150 100 H 330"/>
    <path id="a2" d="M470 100 H 650"/>
    <path id="a3" d="M790 100 H 950"/>
    <path id="ret" d="M950 160 H 150" />
  </defs>

  <rect width="1100" height="300" fill="url(#authBg)" rx="16"/>
  <rect x="0.5" y="0.5" width="1099" height="299" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="30" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7C8494" letter-spacing="2">AUTHENTICATION FLOW</text>

  <g transform="translate(30,74)">
    <rect width="120" height="52" rx="10" fill="#12141B" stroke="#3B6FE0" stroke-width="1.3"/>
    <text x="60" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#E7E9EE">Client</text>
  </g>

  <g transform="translate(330,74)">
    <rect width="140" height="52" rx="10" fill="#12141B" stroke="#3B6FE0" stroke-width="1.3"/>
    <text x="70" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#E7E9EE">API Gateway</text>
  </g>

  <g transform="translate(650,74)">
    <rect width="140" height="52" rx="10" fill="#12141B" stroke="#4FD1C5" stroke-width="1.3" stroke-opacity="0.8"/>
    <text x="70" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#E7E9EE">Auth Service</text>
  </g>

  <g transform="translate(950,74)">
    <rect width="120" height="52" rx="10" fill="#12141B" stroke="#5B5BD6" stroke-width="1.3" stroke-opacity="0.8"/>
    <text x="60" y="24" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#E7E9EE">Token Store</text>
    <text x="60" y="40" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#7C8494">Redis</text>
  </g>

  <g stroke="#3B6FE0" stroke-opacity="0.3" stroke-width="1.4" fill="none">
    <use href="#a1"/>
    <use href="#a2"/>
    <use href="#a3"/>
  </g>
  <path d="M950 160 H 150" stroke="#4FD1C5" stroke-opacity="0.25" stroke-width="1.4" fill="none" stroke-dasharray="4 5"/>

  <text x="180" y="94" font-family="Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5B6172">credentials</text>
  <text x="510" y="94" font-family="Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5B6172">verify</text>
  <text x="840" y="94" font-family="Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5B6172">issue</text>
  <text x="480" y="154" font-family="Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#5B6172">access + refresh token</text>

  <circle r="5" fill="url(#tokenGlow)">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion>
  </circle>
  <circle r="5" fill="url(#tokenGlow)">
    <animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion>
  </circle>
  <circle r="5" fill="url(#tokenGlow)">
    <animateMotion dur="2.6s" begin="1s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion>
  </circle>
  <circle r="5" fill="#4FD1C5" opacity="0.9">
    <animateMotion dur="3s" begin="1.6s" repeatCount="indefinite"><mpath href="#ret"/></animateMotion>
  </circle>

  <text x="30" y="260" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5B6172">Short-lived JWT access tokens; refresh tokens rotated server-side and stored hashed to limit blast radius on leak.</text>
</svg>
