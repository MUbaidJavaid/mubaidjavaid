<svg width="528" height="320" viewBox="0 0 528 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .h { font-family: Helvetica Neue, Arial, sans-serif; }
      .kicker { font-size: 10.5px; fill: #5B6172; letter-spacing: 1.5px; }
      .title { font-size: 18px; font-weight: 600; fill: #F4F5F7; }
      .label { font-size: 10px; fill: #4FD1C5; letter-spacing: 1.5px; }
      .body { font-size: 12px; fill: #A9AFBC; }
      .stack { font-size: 11.5px; fill: #7C8494; }
      .impact { font-size: 12.5px; fill: #4FD1C5; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="527" height="319" rx="14" fill="#0D0F14" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="0" y="0" width="4" height="320" rx="2" fill="#4FD1C5"/>

  <text x="28" y="34" class="h kicker">03 / 04</text>
  <text x="28" y="62" class="h title">Realtime Ops Dashboard</text>
  <line x1="28" y1="76" x2="500" y2="76" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <text x="28" y="100" class="h label">PROBLEM</text>
  <text x="28" y="120" class="h body">An internal team checked three separate tools to gauge</text>
  <text x="28" y="136" class="h body">system health — incidents were noticed too late.</text>

  <text x="28" y="164" class="h label">SOLUTION</text>
  <text x="28" y="184" class="h body">One React dashboard aggregating latency, queue depth,</text>
  <text x="28" y="200" class="h body">and error rate through a lightweight polling layer, with</text>
  <text x="28" y="216" class="h body">threshold-based alerts instead of raw numbers.</text>

  <text x="28" y="244" class="h label">STACK</text>
  <text x="28" y="264" class="h stack">React &#183; TypeScript &#183; Node.js &#183; REST APIs &#183; Recharts</text>

  <line x1="28" y1="280" x2="500" y2="280" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <circle cx="34" cy="298" r="3" fill="#4FD1C5"/>
  <text x="46" y="302" class="h impact">Mean time-to-notice dropped from ~20 min to under 2</text>
</svg>
