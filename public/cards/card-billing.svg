<svg width="528" height="320" viewBox="0 0 528 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .h { font-family: Helvetica Neue, Arial, sans-serif; }
      .kicker { font-size: 10.5px; fill: #5B6172; letter-spacing: 1.5px; }
      .title { font-size: 18px; font-weight: 600; fill: #F4F5F7; }
      .label { font-size: 10px; fill: #3B6FE0; letter-spacing: 1.5px; }
      .body { font-size: 12px; fill: #A9AFBC; }
      .stack { font-size: 11.5px; fill: #7C8494; }
      .impact { font-size: 12.5px; fill: #4FD1C5; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="527" height="319" rx="14" fill="#0D0F14" stroke="#FFFFFF" stroke-opacity="0.07"/>
  <rect x="0" y="0" width="4" height="320" rx="2" fill="#3B6FE0"/>

  <text x="28" y="34" class="h kicker">01 / 04</text>
  <text x="28" y="62" class="h title">Metered SaaS Billing Platform</text>
  <line x1="28" y1="76" x2="500" y2="76" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <text x="28" y="100" class="h label">PROBLEM</text>
  <text x="28" y="120" class="h body">Usage-based overages needed billing without double</text>
  <text x="28" y="136" class="h body">charging when Stripe webhooks arrived out of order.</text>

  <text x="28" y="164" class="h label">SOLUTION</text>
  <text x="28" y="184" class="h body">Idempotent ingestion keyed on event ID, nightly</text>
  <text x="28" y="200" class="h body">reconciliation against Stripe totals, and a dead-letter</text>
  <text x="28" y="216" class="h body">queue for anything that fails processing.</text>

  <text x="28" y="244" class="h label">STACK</text>
  <text x="28" y="264" class="h stack">Next.js &#183; Node.js &#183; MongoDB &#183; Stripe &#183; Redis</text>

  <line x1="28" y1="280" x2="500" y2="280" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <circle cx="34" cy="298" r="3" fill="#4FD1C5"/>
  <text x="46" y="302" class="h impact">Zero duplicate charges across 3 billing cycles &#183; p95 &lt; 400ms</text>
</svg>
