<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0C10"/>
      <stop offset="100%" stop-color="#0D0F14"/>
    </linearGradient>
    <radialGradient id="footGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(600 30) scale(500 160)">
      <stop offset="0%" stop-color="#3B6FE0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B6FE0" stop-opacity="0"/>
    </radialGradient>
    <filter id="footBlur"><feGaussianBlur stdDeviation="40"/></filter>
    <linearGradient id="ctaUnderline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="100%" stop-color="#4FD1C5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#footBg)"/>
  <g filter="url(#footBlur)"><rect width="1200" height="220" fill="url(#footGlow)"/></g>
  <rect x="0.5" y="0.5" width="1199" height="219" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

  <text x="600" y="82" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="600" fill="#F4F5F7">
    Let&#8217;s build something that scales.
  </text>
  <rect x="490" y="98" width="220" height="2.5" rx="1.25" fill="url(#ctaUnderline)">
    <animate attributeName="width" values="0;220" dur="1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
    <animate attributeName="x" values="600;490" dur="1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </rect>

  <text x="600" y="130" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#8890A0">
    Open to full&#8211;stack engineering roles, contract builds, and technical collaboration.
  </text>

  <!-- icon row -->
  <g transform="translate(500,158)" fill="none" stroke="#C7CBD4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- mail -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="26" height="19" rx="3"/>
      <path d="M1 2 L13 12 L25 2"/>
    </g>
    <!-- github mark -->
    <g transform="translate(50,-2)">
      <path d="M11.5 0.5C5.15 0.5 0 5.65 0 12c0 5.08 3.29 9.38 7.86 10.9.58.1.79-.25.79-.56v-2.2c-3.2.7-3.87-1.37-3.87-1.37-.53-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.23 2.75.12 3.04.73.8 1.17 1.83 1.17 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.15v3.19c0 .31.21.67.8.56A11.51 11.51 0 0 0 23 12c0-6.35-5.15-11.5-11.5-11.5Z"/>
    </g>
    <!-- linkedin -->
    <g transform="translate(98,0)">
      <rect x="0" y="6" width="5" height="14" fill="#C7CBD4" stroke="none"/>
      <circle cx="2.5" cy="1.7" r="2.3" fill="#C7CBD4" stroke="none"/>
      <path d="M11 20V6h5v2.2c1-1.6 2.7-2.6 4.7-2.6 3.5 0 5.3 2.3 5.3 6.6V20h-5v-6.7c0-1.9-.7-3.2-2.4-3.2-1.3 0-2.1.9-2.4 1.8-.1.3-.2.8-.2 1.3V20h-5Z" fill="#C7CBD4" stroke="none"/>
    </g>
    <!-- globe -->
    <g transform="translate(150,0)">
      <circle cx="10" cy="10" r="9.5"/>
      <path d="M0.5 10h19M10 0.5c3 3 3 16 0 19M10 0.5c-3 3-3 16 0 19"/>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/>
  </g>
</svg>
