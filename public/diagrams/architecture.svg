<svg width="1100" height="420" viewBox="0 0 1100 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1100" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="100%" stop-color="#0E1016"/>
    </linearGradient>
    <linearGradient id="nodeStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B5BD6"/>
      <stop offset="100%" stop-color="#3B6FE0"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity="1"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <path id="p1" d="M150 90 H 330"/>
    <path id="p2" d="M470 90 H 620"/>
    <path id="p3" d="M700 70 V 30 H 900"/>
    <path id="p4" d="M700 110 V 200 H 900"/>
    <path id="p5" d="M700 90 H 780 V 320 H 900"/>
    <path id="p6" d="M980 90 V 320"/>
  </defs>

  <rect width="1100" height="420" fill="url(#archBg)" rx="16"/>
  <rect x="0.5" y="0.5" width="1099" height="419" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="30" y="40" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#7C8494" letter-spacing="2">SYSTEM ARCHITECTURE</text>

  <!-- Client -->
  <g transform="translate(30,64)">
    <rect width="120" height="52" rx="10" fill="#12141B" stroke="url(#nodeStroke)" stroke-width="1.3"/>
    <text x="60" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#E7E9EE">Client (Next.js)</text>
  </g>

  <!-- Edge / CDN -->
  <g transform="translate(330,64)">
    <rect width="140" height="52" rx="10" fill="#12141B" stroke="url(#nodeStroke)" stroke-width="1.3"/>
    <text x="70" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#E7E9EE">Edge / CDN</text>
  </g>

  <!-- API Gateway -->
  <g transform="translate(620,64)">
    <rect width="140" height="52" rx="10" fill="#12141B" stroke="url(#nodeStroke)" stroke-width="1.3"/>
    <text x="70" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#E7E9EE">API Gateway</text>
  </g>

  <!-- Auth Service -->
  <g transform="translate(900,4)">
    <rect width="150" height="52" rx="10" fill="#12141B" stroke="#4FD1C5" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="75" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#E7E9EE">Auth Service</text>
  </g>

  <!-- Business Services -->
  <g transform="translate(900,174)">
    <rect width="150" height="52" rx="10" fill="#12141B" stroke="#4FD1C5" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="75" y="24" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#E7E9EE">Service Layer</text>
    <text x="75" y="40" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="10.5" fill="#7C8494">Node.js / Express</text>
  </g>

  <!-- Queue -->
  <g transform="translate(900,294)">
    <rect width="150" height="52" rx="10" fill="#12141B" stroke="#5B5BD6" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="75" y="32" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#E7E9EE">Job Queue</text>
  </g>

  <!-- Database / Cache column -->
  <g transform="translate(1080,4)">
  </g>
  <g transform="translate(870,294)"></g>

  <g transform="translate(970,360)">
    <rect width="80" height="40" rx="8" fill="#12141B" stroke="#3B6FE0" stroke-opacity="0.5"/>
    <text x="40" y="24" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#C7CBD4">MongoDB</text>
  </g>

  <!-- connecting lines -->
  <g stroke="#3B6FE0" stroke-opacity="0.28" stroke-width="1.4" fill="none">
    <use href="#p1"/>
    <use href="#p2"/>
    <use href="#p3"/>
    <use href="#p4"/>
  </g>
  <path d="M975 226 V 320 H 900" stroke="#3B6FE0" stroke-opacity="0.28" stroke-width="1.4" fill="none"/>
  <path d="M975 320 V 360" stroke="#3B6FE0" stroke-opacity="0.28" stroke-width="1.4" fill="none"/>

  <!-- animated flow dots -->
  <circle r="5" fill="url(#dotGlow)">
    <animateMotion dur="3s" repeatCount="indefinite">
      <mpath href="#p1"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="url(#dotGlow)">
    <animateMotion dur="3s" begin="0.4s" repeatCount="indefinite">
      <mpath href="#p2"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="url(#dotGlow)">
    <animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite">
      <mpath href="#p3"/>
    </animateMotion>
  </circle>
  <circle r="5" fill="url(#dotGlow)">
    <animateMotion dur="2.6s" begin="1.2s" repeatCount="indefinite">
      <mpath href="#p4"/>
    </animateMotion>
  </circle>

  <text x="30" y="400" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#5B6172">Client requests are edge-cached where possible, authenticated at the gateway, and routed to stateless services backed by a queue for async work.</text>
</svg>
