# Datadog Synthetic tests (optional).
# Skipped until repository secrets are set:
#   DD_API_KEY, DD_APP_KEY
# https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

name: Run Datadog Synthetic tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  synthetics:
    # Do not fail CI when Datadog is not configured for this repo.
    if: ${{ secrets.DD_API_KEY != '' && secrets.DD_APP_KEY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Run Datadog Synthetic tests
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'
